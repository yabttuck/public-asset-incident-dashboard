<!DOCTYPE html><html lang="ko"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공공 시설물·전산 자산 장애 관리 - 로그인</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans KR & Geist -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'Geist', 'sans-serif'],
            mono: ['GeistMono', 'ui-monospace', 'monospace'],
          },
          colors: {
            krds: {
              navy: '#003675',
              navyHover: '#002856',
              navyLight: '#EBF2FA',
              blueBorder: '#B9D1EA',
              grayBg: '#F4F6F9',
              cardBorder: '#D8DDE6',
              muted: '#64748B',
              textPrimary: '#1E293B',
              borderLight: '#E2E8F0',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Subtle official geometric grid background */
    .krds-grid-pattern {
      background-color: #F4F6F9;
      background-image: 
        radial-gradient(#CBD5E1 0.75px, transparent 0.75px), 
        linear-gradient(to right, rgba(226, 232, 240, 0.4) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.4) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
    }
  </style>
</head>
<body class="text-krds-textPrimary min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-[#003675] selection:text-white bg-white">

  <!-- Top Institutional Bar (KRDS Standard) -->
  <header class="w-full bg-white/80 backdrop-blur-sm border-b border-[#E2E8F0] px-6 py-2.5 flex items-center justify-between text-xs text-krds-muted">
    <div class="flex items-center gap-3">
      <!-- 대한민국 정부 공공 포털 상징 마크 / 훈민정음 격식 바 -->
      <div class="flex items-center gap-1.5 font-medium text-slate-700">
        <svg class="w-4 h-4 text-[#003675]" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="10" fill="#003675"></circle>
          <path d="M12 4a8 8 0 0 1 7.4 5H4.6A8 8 0 0 1 12 4z" fill="#D92D20"></path>
          <path d="M4.6 15a8 8 0 0 0 14.8 0H4.6z" fill="#003675"></path>
          <circle cx="12" cy="12" r="3" fill="#FFFFFF"></circle>
        </svg>
        <span>기관 내부 사용자를 위한 장애 접수·처리 서비스</span>
      </div>
      <span class="text-slate-300">|</span>
      <span class="hidden sm:inline">공공 시설물·전산 자산 장애 접수 및 처리</span>
    </div>
    <div class="flex items-center gap-4">
      <span class="inline-flex items-center gap-1.5 font-mono text-[11px] text-emerald-600 bg-emerald-50 px-2 py-0.5 border border-emerald-200">
        
        기관 계정 로그인
      </span>
      
    </div>
  </header>

  <!-- Main Center Content -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-auto">
    <div class="w-full max-w-[570px] bg-white border-[#D8DDE6] overflow-hidden transition-all" style="box-shadow: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none;">
      
      <!-- Card Header: Emblem + System Title -->
      <div class="px-8 pt-10 text-center pb-3">
        <h1 class="text-[34px] font-bold text-slate-900 tracking-tight leading-[42px]">
          공공 시설물·전산 자산<br class="hidden sm:inline">
          통합관제 시스템
        </h1>
        <p class="text-[18px] text-krds-muted mt-3 font-normal leading-relaxed">
          장애를 접수하고 진행 상태를 확인하는 내부 업무 서비스
        </p>
      </div>

      <div class="p-8 space-y-6 pt-4">

        <!-- Login Form -->
        <form class="space-y-5" onsubmit="handleLoginSubmit(event)">
          <!-- Input 1: ID / Email -->
          <div>
            <label for="username" class="block text-[14px] font-semibold text-slate-700 mb-2 flex items-center justify-between">
              <span>기관 이메일 또는 사번</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="mail" class="lucide lucide-mail w-5 h-5"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg>
              </div>
              <input type="text" id="username" name="username" placeholder="이메일 또는 사번" class="block w-full pl-11 pr-4 py-3 text-[16px] bg-white border border-[#D8DDE6] text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#003675] focus:border-transparent transition-all shadow-sm font-sans" required="">
            </div>
          </div>

          <!-- Input 2: Password with toggle -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label for="password" class="block text-[14px] font-semibold text-slate-700">비밀번호</label>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="lock" class="lucide lucide-lock w-5 h-5"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </div>
              <input type="password" id="password" name="password" placeholder="인증 비밀번호 입력" class="block w-full pl-11 pr-11 py-3 text-[16px] bg-white border border-[#D8DDE6] text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#003675] focus:border-transparent transition-all shadow-sm font-sans tracking-tight" required="">
              <button type="button" id="toggle-pw-btn" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" title="비밀번호 보기/숨기기">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="eye" id="toggle-pw-icon" class="lucide lucide-eye w-5 h-5"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <!-- Primary CTA Button (Full width, #003675) -->
          <button type="submit" class="w-full bg-[#003675] hover:bg-[#002856] active:bg-[#001E40] text-white py-3.5 px-5 font-semibold text-[16px] transition-all duration-150 shadow-md shadow-[#003675]/20 flex items-center justify-center gap-2.5 group mt-3 focus:ring-2 focus:ring-offset-2 focus:ring-[#003675]">
            <span id="btn-text">로그인</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-right" class="lucide lucide-arrow-right w-5 h-5 transition-transform group-hover:translate-x-0.5"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
          </button>
        </form>

        <!-- Footer Notice inside Card -->
        <div class="pt-2 border-t border-slate-100">
          <p class="text-[13px] text-[#64748B] leading-relaxed text-center font-normal">
            로그인 계정의 권한에 따라 이용 가능한 화면이 달라집니다.
          </p>
        </div>

      </div>
    </div>
  </main>

  <!-- Bottom Official Footer -->
  <footer class="w-full py-4 px-6 border-t border-[#E2E8F0] bg-white/70 backdrop-blur-sm text-center text-xs text-krds-muted flex flex-col sm:flex-row items-center justify-between gap-2 max-w-6xl mx-auto">
    <div class="flex items-center gap-2 text-slate-600">
      <span class="font-semibold text-slate-800">공공 시설물·전산 자산 장애 관리</span>
      <span>•</span>
      <span>내부 사용자용 업무 서비스</span>
    </div>
    <div class="flex items-center gap-4 text-[11px] text-slate-500">
      <a href="#" class="hover:underline">서비스 안내</a>
      <span>|</span>
      
      <span>|</span>
      
    </div>
  </footer>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Password visibility control
    // Password Toggle Functionality
    function togglePassword() {
      const pwInput = document.getElementById('password');
      const pwIcon = document.getElementById('toggle-pw-icon');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        pwIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwInput.type = 'password';
        pwIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function handleLoginSubmit(e) { e.preventDefault(); }
  </script>




</body></html>
